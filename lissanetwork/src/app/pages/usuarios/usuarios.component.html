<div class="usuarios-wrapper">

  <!-- LISTADO -->
  <div *ngIf="!mostrarFormulario">

    <div class="header">
      <h2>Usuarios con Acceso al Sistema</h2>

      <button 
        type="button"
        class="btn-add" 
        (click)="abrirFormulario()">
        + Nuevo Usuario
      </button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nombre Completo</th>
          <th>Usuario</th>
          <th>Correo</th>
          <th>Teléfono</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>

      <tbody>

        <tr *ngFor="let user of usuarios">

          <td>{{ user.nombre_completo }}</td>
          <td>{{ user.usuario }}</td>
          <td>{{ user.correo }}</td>
          <td>{{ user.telefono }}</td>

          <td>
            <span 
              class="estado"
              [class.activo]="user.estado === 'Activo'"
              [class.inactivo]="user.estado === 'Inactivo'">
              {{ user.estado }}
            </span>
          </td>

          <td class="acciones">

            <button 
              type="button"
              class="btn-icon edit" 
              title="Editar usuario"
              (click)="editarUsuario(user)">
              ✏️
            </button>

            <button 
              type="button"
              class="btn-icon delete" 
              title="Eliminar usuario"
              (click)="eliminarUsuario(user)">
              🗑️
            </button>

            <button 
              type="button"
              class="btn-icon roles" 
              title="Asignar roles"
              (click)="abrirRoles(user)">
              👤
            </button>

            <button 
              type="button"
              class="btn-icon permisos" 
              title="Asignar permisos"
              (click)="abrirPermisos(user)">
              🔐
            </button>

          </td>

        </tr>

        <tr *ngIf="usuarios.length === 0">
          <td colspan="6" class="sin-datos">
            No hay usuarios registrados
          </td>
        </tr>

      </tbody>
    </table>

  </div>

  <!-- FORMULARIO -->
  <div *ngIf="mostrarFormulario" class="form-card">

    <div class="form-header">
      <h2>{{ modoEdicion ? 'Editar Usuario' : 'Nuevo Usuario' }}</h2>

      <button 
        type="button"
        class="btn-back" 
        (click)="cancelar()">
        ← Volver
      </button>
    </div>

    <div class="form-grid">

      <div class="form-group">
        <label>Nombre Completo</label>
        <input 
          type="text"
          placeholder="Ingrese el nombre completo"
          [(ngModel)]="usuarioActual.nombre_completo">
      </div>

      <div class="form-group">
        <label>Usuario</label>
        <input 
          type="text"
          placeholder="Ingrese el nombre de usuario"
          [(ngModel)]="usuarioActual.usuario">
      </div>

      <div class="form-group">
        <label>Correo</label>
        <input 
          type="email"
          placeholder="Ingrese el correo"
          [(ngModel)]="usuarioActual.correo">
      </div>

      <div class="form-group">
        <label>Teléfono</label>
        <input 
          type="text"
          placeholder="Ingrese el teléfono"
          [(ngModel)]="usuarioActual.telefono">
      </div>

      <div class="form-group">
        <label>
          Contraseña
          <span *ngIf="modoEdicion" class="nota">
            dejar vacío si no desea cambiarla
          </span>
        </label>

        <input 
          type="password"
          placeholder="Ingrese la contraseña"
          [(ngModel)]="usuarioActual.contrasena">
      </div>

      <div class="form-group">
        <label>Estado</label>

        <select [(ngModel)]="usuarioActual.estado">
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </div>

    </div>

    <div class="form-actions">
      <button 
        type="button"
        class="btn-save" 
        (click)="guardarUsuario()">
        {{ modoEdicion ? 'Actualizar' : 'Guardar' }}
      </button>
    </div>

  </div>

</div>
