<div class="salida-wrapper">

  <div class="salida-card">

    <h2>Registro de Nueva Salida</h2>

    <!-- INFORMACIÓN SUPERIOR -->
    <div class="top-grid">

      <div class="form-group">
        <label>Fecha</label>
        <input type="date" [(ngModel)]="salida.fecha">
      </div>

      <div class="form-group">
        <label>Folio Salida</label>
        <input type="text" [(ngModel)]="salida.folio">
      </div>

      <div class="form-group">
        <label>Técnico</label>
        <input 
          type="text" 
          [(ngModel)]="salida.tecnico"
          placeholder="Nombre del técnico">
      </div>

      <div class="form-group">
        <label>No. Factura</label>
        <input 
          type="text" 
          [(ngModel)]="salida.factura"
          placeholder="Factura de la entrada">
      </div>

    </div>

    <!-- PRODUCTO -->
    <div class="section">

      <h3>Buscar producto por código</h3>

      <div class="producto-con-imagen">

        <!-- CAMPOS DEL PRODUCTO -->
        <div class="producto-campos">

          <div class="grid-2">

            <div class="form-group">
              <label>Escanear o escribir código</label>
              <input 
                type="text" 
                [(ngModel)]="salida.codigo"
                placeholder="Escanee o escriba el código"
                autocomplete="off"
                autofocus
                (input)="detectarCodigoScanner()"
                (keyup.enter)="buscarProductoPorCodigo()">
            </div>

            <div class="form-group">
              <label>Nombre del Producto</label>
              <input 
                type="text" 
                [(ngModel)]="salida.nombre"
                readonly>
            </div>

            <div class="form-group">
              <label>Categoría</label>
              <input 
                type="text" 
                [(ngModel)]="salida.categoria"
                readonly>
            </div>

            <div class="form-group">
              <label>Proveedor</label>
              <input 
                type="text" 
                [(ngModel)]="salida.proveedor"
                readonly>
            </div>

          </div>

        </div>

        <!-- IMAGEN DEL PRODUCTO -->
        <div class="imagen-producto-card">

          <label class="titulo-imagen">Imagen del Producto</label>

          <div class="imagen-preview">

            <img 
              *ngIf="imagenPreview" 
              [src]="imagenPreview" 
              alt="Imagen del producto">

            <div *ngIf="!imagenPreview" class="imagen-placeholder">
              <div class="icono-imagen">📦</div>
              <p>No hay imagen seleccionada</p>
            </div>

          </div>

          <p *ngIf="nombreImagen" class="nombre-imagen">
            Imagen cargada: {{ nombreImagen }}
          </p>

          <small>
            La imagen se carga automáticamente desde la entrada del producto.
          </small>

        </div>

      </div>

    </div>

    <!-- DETALLE SALIDA -->
    <div class="section">

      <h3>Detalle de la Salida</h3>

      <div class="grid-3">

        <div class="form-group">
          <label>Unidades Disponibles</label>
          <input 
            type="number" 
            [(ngModel)]="salida.disponibles"
            readonly>
        </div>

        <div class="form-group">
          <label>Número de Unidades a Sacar</label>
          <input 
            type="number" 
            [(ngModel)]="salida.unidades"
            placeholder="Ingrese las unidades">
        </div>

      </div>

    </div>

    <!-- BOTÓN -->
    <div class="actions">
      <button 
        type="button"
        class="btn-primary" 
        (click)="registrarSalida()">
        Registrar Salida y Descargar Pase
      </button>
    </div>

  </div>

</div>
